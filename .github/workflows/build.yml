name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - personal_build
    paths-ignore:
      - '*.md'
      - '.github/workflows/**'
      - 'repo.json'
      - 'plugins.json'
      - 'DomainCheck.py'
      - '*.cs3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: personal_build

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Copy artifacts and patch plugins.json
        run: |
          # Copy built .cs3 files to repo root
          find . -path './.git' -prune -o -name '*.cs3' -print | xargs -I{} cp {} . 2>/dev/null || true
          # Fix branch name in auto-generated plugins.json (Gradle plugin hardcodes 'builds')
          if [ -f build/plugins.json ]; then
            sed 's|/builds/|/personal_build/|g' build/plugins.json > plugins.json
          fi

      - name: Push artifacts to personal_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add *.cs3 plugins.json
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push origin personal_build
